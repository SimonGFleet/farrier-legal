<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; line-height: 1.4; }
      .card { max-width: 520px; margin: 0 auto; border: 1px solid #3333; border-radius: 12px; padding: 16px; }
      input { width: 100%; padding: 10px; font-size: 16px; margin: 8px 0 12px; border-radius: 10px; border: 1px solid #3336; }
      button { padding: 10px 14px; font-size: 16px; border-radius: 10px; border: 1px solid #3336; cursor: pointer; }
      .muted { opacity: 0.7; }
      .error { color: #b00020; }
      .ok { color: #0a7a2f; }
      code { background: #0001; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Reset your password</h2>

      <div id="status" class="muted">Loading…</div>

      <form id="form" style="display:none;">
        <label>New password</label>
        <input id="pw" type="password" minlength="8" autocomplete="new-password" required />

        <label>Confirm new password</label>
        <input id="pw2" type="password" minlength="8" autocomplete="new-password" required />

        <button type="submit">Update password</button>
        <div id="msg" style="margin-top:12px;"></div>
      </form>

      <p class="muted" style="margin-top:14px;">
        If this page says your session is missing, request a new reset email.
      </p>
    </div>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      // TODO: paste your values (anon key is safe to use in a public client)
      const SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co";
      const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const statusEl = document.getElementById("status");
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");

      function setStatus(text, cls) {
        statusEl.className = cls || "muted";
        statusEl.textContent = text;
      }

      function parseHashParams() {
        const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
        return new URLSearchParams(hash);
      }

      async function ensureSessionFromUrl() {
        // Case A: PKCE code in query (?code=...)
        const qs = new URLSearchParams(window.location.search);
        const code = qs.get("code");
        if (code) {
          // supabase-js v2 supports exchanging an auth code for a session
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
          return;
        }

        // Case B: implicit tokens in hash (#access_token=...&refresh_token=...)
        const hp = parseHashParams();
        const access_token = hp.get("access_token");
        const refresh_token = hp.get("refresh_token");
        if (access_token && refresh_token) {
          const { error } = await supabase.auth.setSession({ access_token, refresh_token });
          if (error) throw error;
          return;
        }
      }

      async function main() {
        try {
          setStatus("Preparing secure session…");
          await ensureSessionFromUrl();

          const { data, error } = await supabase.auth.getSession();
          if (error) throw error;

          if (!data?.session) {
            setStatus("Session missing. Please request a new reset email.", "error");
            return;
          }

          setStatus("Session ready. Choose a new password.");
          form.style.display = "block";
        } catch (e) {
          console.error(e);
          setStatus("Could not validate reset link. Please request a new reset email.", "error");
        }
      }

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        msg.textContent = "";
        msg.className = "";

        const pw = document.getElementById("pw").value;
        const pw2 = document.getElementById("pw2").value;

        if (pw !== pw2) {
          msg.textContent = "Passwords do not match.";
          msg.className = "error";
          return;
        }

        try {
          setStatus("Updating password…");
          const { error } = await supabase.auth.updateUser({ password: pw });
          if (error) throw error;

          setStatus("✅ Password updated.", "ok");
          msg.textContent = "You can go back to the app and sign in with your new password.";
          msg.className = "ok";
          form.reset();
        } catch (e) {
          console.error(e);
          setStatus("Error updating password.", "error");
          msg.textContent = "That didn’t work — try requesting a fresh reset email.";
          msg.className = "error";
        }
      });

      main();
    </script>
  </body>
</html>
