<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; line-height: 1.4; }
      .card { max-width: 640px; margin: 0 auto; border: 1px solid #3333; border-radius: 12px; padding: 16px; }
      input { width: 100%; padding: 10px; font-size: 16px; margin: 8px 0 12px; border-radius: 10px; border: 1px solid #3336; box-sizing: border-box; }
      button { padding: 10px 14px; font-size: 16px; border-radius: 10px; border: 1px solid #3336; cursor: pointer; }
      .muted { opacity: 0.75; }
      .error { color: #b00020; }
      .ok { color: #0a7a2f; }
      .row { display: flex; gap: 10px; align-items: center; }
      .row > * { flex: 1; }
      code { background: #0001; padding: 2px 6px; border-radius: 6px; }
      .tiny { font-size: 12px; }
      .hide { display: none; }
      pre { background: #0001; padding: 10px; border-radius: 10px; overflow:auto; }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Reset your password</h2>

      <div id="status" class="muted">Loading…</div>

      <form id="form" class="hide">
        <label>New password</label>
        <input id="pw" type="password" minlength="6" autocomplete="new-password" required />

        <label>Confirm new password</label>
        <input id="pw2" type="password" minlength="6" autocomplete="new-password" required />

        <div class="row">
          <button id="submitBtn" type="submit">Update password</button>
          <button id="signOutBtn" type="button">Sign out</button>
        </div>

        <div id="msg" style="margin-top:12px;"></div>
      </form>

      <p class="muted tiny" style="margin-top:14px;">
        This page must be opened via the <strong>password reset email link</strong>.
        Opening it directly from <code>index.html</code> will not work.
      </p>

      <details class="muted tiny" style="margin-top:10px;">
        <summary>Debug info (useful if it fails)</summary>
        <div id="debug"></div>
        <div id="debug2"></div>
      </details>
    </div>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      // ✅ MUST match the same Supabase project your app uses
      const SUPABASE_URL = "https://fbjyrqlxjunkotzsyyyl.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_5Eh6OoFV7oQSS8uFc1PJ7A_f8rXV2aS";

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          detectSessionInUrl: true, // key for recovery links
        },
      });

      const statusEl = document.getElementById("status");
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      const debugEl = document.getElementById("debug");
      const debugEl2 = document.getElementById("debug2");
      const submitBtn = document.getElementById("submitBtn");
      const signOutBtn = document.getElementById("signOutBtn");

      function setStatus(text, cls = "muted") {
        statusEl.className = cls;
        statusEl.textContent = text;
      }
      function setMsg(text, cls = "") {
        msg.className = cls;
        msg.textContent = text || "";
      }
      function showForm(show) {
        form.classList.toggle("hide", !show);
      }

      function parseHash() {
        const raw = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
        return new URLSearchParams(raw);
      }

      function renderDebug(extra = {}) {
        const qs = new URLSearchParams(window.location.search);
        const hp = parseHash();

        // Show whether we have tokens or an error
        const shape = {
          supabase_url: SUPABASE_URL,
          has_code: qs.has("code"),
          has_token_hash: qs.has("token_hash"),
          type: qs.get("type") || hp.get("type") || "",
          has_access_token: hp.has("access_token"),
          has_refresh_token: hp.has("refresh_token"),
          hash_error: hp.get("error") || "",
          hash_error_code: hp.get("error_code") || "",
          hash_error_description: hp.get("error_description") || "",
          ...extra,
        };

        debugEl.innerHTML = Object.entries(shape)
          .map(([k, v]) => `<div><strong>${k}:</strong> ${String(v).replaceAll("<","&lt;").replaceAll(">","&gt;")}</div>`)
          .join("");
      }

      async function printSession(label) {
        const { data, error } = await supabase.auth.getSession();
        debugEl2.innerHTML =
          `<div style="margin-top:10px;"><strong>${label}</strong></div>` +
          `<pre>${JSON.stringify({ hasSession: !!data?.session, user: data?.session?.user?.email || null, error: error?.message || null }, null, 2)}</pre>`;
        return { data, error };
      }

      // Wait briefly for supabase-js to auto-parse URL + emit events
      function wait(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      let gotEvent = false;

      const { data: sub } = supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") {
          gotEvent = true;
          renderDebug({ event });
          if (session) {
            setStatus("Session ready. Choose a new password.");
            showForm(true);
          }
        }
      });

      async function main() {
        renderDebug();

        // If Supabase put an error into the URL hash, show it clearly.
        const hp = parseHash();
        const hashErr = hp.get("error_description") || hp.get("error");
        if (hashErr) {
          setStatus("Reset link error from Supabase:", "error");
          setMsg(decodeURIComponent(hashErr.replaceAll("+"," ")), "error");
          await printSession("Session check (after hash error)");
          showForm(false);
          return;
        }

        setStatus("Validating reset link…");

        // Give supabase-js a moment to detect the session from the URL
        await wait(300);
        await printSession("Session check (initial)");

        // If event already fired + session exists, we’re good
        const { data } = await supabase.auth.getSession();
        if (data?.session) {
          setStatus("Session ready. Choose a new password.");
          showForm(true);
          return;
        }

        // Fallback: manually set session from tokens if present
        if (hp.get("access_token") && hp.get("refresh_token")) {
          setStatus("Establishing session from URL tokens…");
          const access_token = hp.get("access_token");
          const refresh_token = hp.get("refresh_token");

          const { error } = await supabase.auth.setSession({ access_token, refresh_token });
          if (error) {
            setStatus("Could not validate reset link (setSession failed).", "error");
            setMsg(error.message, "error");
            renderDebug({ setSession_error: error.message });
            await printSession("Session check (after setSession error)");
            showForm(false);
            return;
          }

          await printSession("Session check (after setSession)");
          const { data: d2 } = await supabase.auth.getSession();
          if (d2?.session) {
            setStatus("Session ready. Choose a new password.");
            showForm(true);
            return;
          }
        }

        // If we got no event and still no session, show a precise message.
        setStatus("Could not validate reset link. Please request a new reset email.", "error");
        setMsg(
          "Tip: make sure this page uses the SAME Supabase project URL + anon key as your app, and open a FRESH reset email link (links can be single-use).",
          "error"
        );
        await printSession("Session check (final)");
        showForm(false);
      }

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        setMsg("");

        const pw = document.getElementById("pw").value;
        const pw2 = document.getElementById("pw2").value;

        if (pw.length < 6) return setMsg("Password must be at least 6 characters.", "error");
        if (pw !== pw2) return setMsg("Passwords do not match.", "error");

        submitBtn.disabled = true;
        try {
          setStatus("Updating password…");
          const { error } = await supabase.auth.updateUser({ password: pw });
          if (error) throw error;

          setStatus("✅ Password updated.", "ok");
          setMsg("You can go back to the app and sign in with your new password.", "ok");
          form.reset();
        } catch (e) {
          setStatus("Error updating password.", "error");
          setMsg(e?.message ? String(e.message) : "That didn’t work — try requesting a fresh reset email.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });

      signOutBtn.addEventListener("click", async () => {
        try {
          await supabase.auth.signOut();
          setStatus("Signed out.", "muted");
          showForm(false);
          setMsg("");
        } catch {}
      });

      window.addEventListener("beforeunload", () => {
        try { sub?.subscription?.unsubscribe?.(); } catch {}
      });

      main();
    </script>
  </body>
</html>
