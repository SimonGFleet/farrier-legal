<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 24px;
        line-height: 1.4;
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
        border: 1px solid #3333;
        border-radius: 12px;
        padding: 16px;
      }
      input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        margin: 8px 0 12px;
        border-radius: 10px;
        border: 1px solid #3336;
        box-sizing: border-box;
      }
      button {
        padding: 10px 14px;
        font-size: 16px;
        border-radius: 10px;
        border: 1px solid #3336;
        cursor: pointer;
      }
      .muted { opacity: 0.7; }
      .error { color: #b00020; }
      .ok { color: #0a7a2f; }
      .row { display: flex; gap: 10px; align-items: center; }
      .row > * { flex: 1; }
      code { background: #0001; padding: 2px 6px; border-radius: 6px; }
      .tiny { font-size: 12px; }
      .hide { display: none; }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Reset your password</h2>

      <div id="status" class="muted">Loading…</div>

      <form id="form" class="hide">
        <label>New password</label>
        <input id="pw" type="password" minlength="6" autocomplete="new-password" required />

        <label>Confirm new password</label>
        <input id="pw2" type="password" minlength="6" autocomplete="new-password" required />

        <div class="row">
          <button id="submitBtn" type="submit">Update password</button>
          <button id="signOutBtn" type="button">Sign out</button>
        </div>

        <div id="msg" style="margin-top:12px;"></div>
      </form>

      <p class="muted tiny" style="margin-top:14px;">
        This page must be opened via the password reset email link (it needs URL tokens).
        If you opened it manually from <code>index.html</code>, it will fail.
      </p>

      <details class="muted tiny" style="margin-top:10px;">
        <summary>Debug info</summary>
        <div id="debug"></div>
      </details>
    </div>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      // ✅ Fill these in (anon key is safe on a public page)
      const SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co";
      const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const statusEl = document.getElementById("status");
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      const debugEl = document.getElementById("debug");
      const submitBtn = document.getElementById("submitBtn");
      const signOutBtn = document.getElementById("signOutBtn");

      function setStatus(text, cls) {
        statusEl.className = cls || "muted";
        statusEl.textContent = text;
      }

      function setMsg(text, cls) {
        msg.className = cls || "";
        msg.textContent = text || "";
      }

      function showForm(show) {
        form.classList.toggle("hide", !show);
      }

      function safe(str) {
        return String(str || "").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      }

      function renderDebug(extra = {}) {
        const qs = new URLSearchParams(window.location.search);
        const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
        const hp = new URLSearchParams(hash);

        const shape = {
          has_code: qs.has("code"),
          has_token_hash: qs.has("token_hash"),
          type: qs.get("type"),
          has_access_token: hp.has("access_token"),
          has_refresh_token: hp.has("refresh_token"),
          pathname: window.location.pathname,
          ...extra,
        };

        debugEl.innerHTML = Object.entries(shape)
          .map(([k, v]) => `<div><strong>${safe(k)}:</strong> ${safe(v)}</div>`)
          .join("");
      }

      // Try a bunch of session-establishment strategies because Supabase links can vary:
      // - ?code=... (PKCE)
      // - #access_token=...&refresh_token=... (implicit)
      // - ?token_hash=...&type=recovery (OTP-style)
      async function establishSessionFromUrl() {
        const qs = new URLSearchParams(window.location.search);
        const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
        const hp = new URLSearchParams(hash);

        // A) token_hash flow (commonly used in some templates)
        const token_hash = qs.get("token_hash");
        const type = qs.get("type");
        if (token_hash && type) {
          renderDebug({ flow: "verifyOtp(token_hash)" });
          const { error } = await supabase.auth.verifyOtp({ token_hash, type });
          if (error) throw error;
          return;
        }

        // B) helper: getSessionFromUrl (if available) handles code/hash automatically
        if (typeof supabase.auth.getSessionFromUrl === "function") {
          renderDebug({ flow: "getSessionFromUrl()" });
          const { error } = await supabase.auth.getSessionFromUrl({ storeSession: true });
          // Some flows rely on auth state change event; don't hard-fail here.
          if (error) console.warn("getSessionFromUrl error:", error);
        }

        // C) explicit PKCE code
        const code = qs.get("code");
        if (code) {
          renderDebug({ flow: "exchangeCodeForSession(code)" });
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
          return;
        }

        // D) explicit implicit tokens
        const access_token = hp.get("access_token");
        const refresh_token = hp.get("refresh_token");
        if (access_token && refresh_token) {
          renderDebug({ flow: "setSession(access/refresh)" });
          const { error } = await supabase.auth.setSession({ access_token, refresh_token });
          if (error) throw error;
          return;
        }

        renderDebug({ flow: "no_url_tokens_found" });
      }

      async function requireSession() {
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (!data?.session) throw new Error("Session missing");
        return data.session;
      }

      // Some Supabase flows raise PASSWORD_RECOVERY via auth state change.
      // We'll listen and enable the form as soon as a session exists.
      const { data: sub } = supabase.auth.onAuthStateChange(async (_event, session) => {
        if (session) {
          setStatus("Session ready. Choose a new password.");
          showForm(true);
        }
      });

      async function main() {
        try {
          setStatus("Validating reset link…");
          renderDebug();

          await establishSessionFromUrl();

          // If we already got a session, great:
          await requireSession();

          setStatus("Session ready. Choose a new password.");
          showForm(true);
        } catch (e) {
          console.error(e);
          // One last tiny grace period in case onAuthStateChange catches late:
          setStatus("Finalising…");
          await new Promise((r) => setTimeout(r, 300));
          try {
            await requireSession();
            setStatus("Session ready. Choose a new password.");
            showForm(true);
          } catch {
            setStatus("Could not validate reset link. Please request a new reset email.", "error");
            showForm(false);
          }
        }
      }

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        setMsg("");

        const pw = document.getElementById("pw").value;
        const pw2 = document.getElementById("pw2").value;

        if (pw.length < 6) {
          setMsg("Password must be at least 6 characters.", "error");
          return;
        }
        if (pw !== pw2) {
          setMsg("Passwords do not match.", "error");
          return;
        }

        submitBtn.disabled = true;

        try {
          setStatus("Updating password…");
          const { error } = await supabase.auth.updateUser({ password: pw });
          if (error) throw error;

          setStatus("✅ Password updated.", "ok");
          setMsg("You can go back to the app and sign in with your new password.", "ok");
          form.reset();
        } catch (e) {
          console.error(e);
          setStatus("Error updating password.", "error");
          setMsg("That didn’t work — try requesting a fresh reset email.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });

      signOutBtn.addEventListener("click", async () => {
        try {
          await supabase.auth.signOut();
          setStatus("Signed out.", "muted");
          showForm(false);
          setMsg("");
        } catch {}
      });

      window.addEventListener("beforeunload", () => {
        try { sub?.subscription?.unsubscribe?.(); } catch {}
      });

      main();
    </script>
  </body>
</html>
